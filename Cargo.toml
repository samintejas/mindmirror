[package]
name = "mindmirror"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros"] }
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false }
directories = "6.0.0"
git2 = { version = "0.21.0", features = ["https"] }
mime_guess = "2.0.5"
minijinja = "2.21.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
percent-encoding = "2.3.2"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "process"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
